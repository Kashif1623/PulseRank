<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="27" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="20" stroke="rgba(255,255,255,0.20)" stroke-width="1.5" fill="none"/>
  <!-- ECG pulse waveform -->
  <polyline
    points="7,32 14,32 18,22 22,42 26,18 30,32 37,32 40,27 43,38 46,32 57,32"
    stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
